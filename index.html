          <!-- Data Schema -->
          <section class="section" id="data-schema">
            <h2>Database Schema (/schema)</h2>
            <p>The Khel Drishti database contains the following main tables:</p>
            <ul>
              <li><strong>sports:</strong> Master list of 50+ sports with metadata (sport_id, sport_name, category, event counts)</li>
              <li><strong>disciplines:</strong> Sub-disciplines within each sport (e.g., 100m, 200m within Athletics)</li>
              <li><strong>events:</strong> Individual competition events with LA2028 and AG2026 participation flags</li>
              <li><strong>centres:</strong> Training centers with location (state, district), type (NCOE/STC/KIC/KISCE), coordinates</li>
              <li><strong>centre_sport_links:</strong> Mapping of which sports are trained at which centers</li>
              <li><strong>ncoe_capacity:</strong> Detailed capacity data for National Centres of Excellence</li>
              <li><strong>stc_capacity:</strong> Detailed capacity data for State Training Centres</li>
              <li><strong>olympic_medals:</strong> Historical medal records with athlete names, events, years</li>
              <li><strong>olympic_participation:</strong> Athlete participation counts by sport and year</li>
              <li><strong>olympic_timeline:</strong> Key milestones in Indian sports history</li>
              <li><strong>event_overlap:</strong> Analysis of events common to both Olympics and Asian Games</li>
            </ul>
          </section>

          <!-- Government Programs -->
          <section class="section" id="programs">
            <h2>Government Sports Programs</h2>
            
            <h3>Khelo India Scheme</h3>
            <p>Launched in 2018, Khelo India is the flagship sports development program of the Government of India. Key components:</p>
            <ul>
              <li><strong>Khelo India Youth Games:</strong> Annual multi-sport event for under-18 athletes</li>
              <li><strong>Khelo India University Games:</strong> Inter-university sports competition</li>
              <li><strong>Khelo India Athletes:</strong> Scholarship program providing ₹5 lakh/year for 8 years to talented athletes</li>
              <li><strong>Khelo India Centers:</strong> Grassroots sports infrastructure across India</li>
            </ul>

            <h3>Target Olympic Podium Scheme (TOPS)</h3>
            <p>Elite athlete support program for potential Olympic medalists:</p>
            <ul>
              <li>Customized training programs with foreign coaches</li>
              <li>International competition exposure</li>
              <li>Sports science support including physiotherapy, nutrition, psychology</li>
              <li>Equipment and training grants</li>
            </ul>

            <h3>Sports Authority of India (SAI)</h3>
            <p>Apex national sports body managing:</p>
            <ul>
              <li>National training centers across India</li>
              <li>Coach education and certification</li>
              <li>Sports science research</li>
              <li>National coaching camps</li>
