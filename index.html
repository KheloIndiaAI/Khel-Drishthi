        <h1>Khel Drishti - India Sports Analytics Dashboard</h1>
        <p>Welcome to Khel Drishti, India's comprehensive sports analytics platform powered by Khelo India initiative.</p>
        
        <h2>What is Khel Drishti?</h2>
        <p>Khel Drishti is a data-driven dashboard that provides insights into India's sports ecosystem, tracking performance metrics, training infrastructure, and athlete development across the nation.</p>
        
        <h2>Key Features</h2>
        <ul>
          <li><strong>Sports Infrastructure:</strong> Track 400+ training centers across NCOE (National Centre of Excellence), STC (State Training Centres), KIC (Khelo India Centres), and KISCE (Khelo India State Centre of Excellence) programs</li>
          <li><strong>Medal Tracking:</strong> Historical Olympic and Asian Games medal records for Indian athletes</li>
          <li><strong>Athlete Capacity:</strong> Sanctioned and existing athlete capacity across all training programs</li>
          <li><strong>50+ Sports:</strong> Comprehensive coverage of disciplines including Athletics, Badminton, Boxing, Cricket, Hockey, Shooting, Wrestling, and more</li>
          <li><strong>Event Tracking:</strong> LA 2028 Olympics and Asian Games 2026 event preparation</li>
        </ul>
        
        <h2>Dashboard Pages</h2>
        <ul>
          <li><a href="/">Home</a> - Overview with countdown to major games and key statistics</li>
          <li><a href="/infrastructure">Infrastructure</a> - Training center distribution across India</li>
          <li><a href="/medals">Medals</a> - Olympic and Asian Games medal history</li>
          <li><a href="/capacity">Capacity</a> - Athlete training capacity analysis</li>
        </ul>
        
        <h2>Data Sources</h2>
        <p>Data sourced from official Khelo India programs, Sports Authority of India (SAI), and National Sports Federations.</p>
        
        <p><em>Please enable JavaScript for the full interactive dashboard experience.</em></p>
