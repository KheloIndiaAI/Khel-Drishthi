# =============================================================================
# Overlay: Postgres as a container
# =============================================================================
# Use for local development, or on EC2 when you are not using RDS. With RDS,
# leave this file out and set DB_HOST to the RDS endpoint instead.
#
# Uses the stock postgres image (not supabase/postgres) on purpose: it behaves
# like RDS, so the same bootstrap and migrations are exercised everywhere.
# =============================================================================
services:
  db:
    image: postgres:${POSTGRES_VERSION:-15.10}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?}
      POSTGRES_DB: ${DB_NAME:-postgres}
      # Encrypt passwords at rest the same way RDS does.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-256MB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-100}
      - -c
      - log_min_duration_statement=${PG_LOG_SLOW_MS:-1000}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db-data:/var/lib/postgresql/data
    # Bound to localhost only: reachable from the host for psql/pg_dump, never public.
    ports:
      - "127.0.0.1:${DB_PUBLISH_PORT:-54322}:5432"
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  db-init:
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
